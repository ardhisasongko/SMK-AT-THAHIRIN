name = "smk-absensi-sync"
main = "src/index.ts"
compatibility_date = "2026-08-04"

# D1 yang sama dengan aplikasi Pages (sumber kebenaran absensi)
[[d1_databases]]
binding = "DB"
database_name = "smk-at-tahirin-db"
database_id = "e436d309-e92a-430d-8c48-c47752b3391b"

# Cron (UTC). WIB = UTC+7, jadi:
#   "0 13 * * *"  = setiap hari  20:00 WIB  (push foto full -> Google Drive + tabel Harian)
#   "0 14 * * 0"  = Minggu       21:00 WIB  (tabel Rekap mingguan)
[triggers]
crons = ["0 13 * * *", "0 14 * * SUN"]

[vars]
APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMLIIxe0tnw-tduy3NDSA36eUxAGvw2TGa9NGY8DZsRZXRn4-ci3h_PvXUF7HV6wUTkA/exec"
SYNC_TOKEN = "SMK_ABSEN_2026"
