name = "smk-absensi-sync"
main = "src/index.ts"
compatibility_date = "2026-08-04"

# D1 yang sama dengan aplikasi Pages (sumber kebenaran absensi)
[[d1_databases]]
binding = "DB"
database_name = "smk-at-tahirin-db"
database_id = "e436d309-e92a-430d-8c48-c47752b3391b"

# Cron (UTC). WIB = UTC+7, jadi:
#   "0 13 * * *"  = setiap hari  20:00 WIB  (push foto full -> Google Drive + tabel Harian)
#   "0 14 * * 0"  = Minggu       21:00 WIB  (tabel Rekap mingguan)
[triggers]
crons = ["0 13 * * *", "0 14 * * 0"]

[vars]
APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwM8BSf3UVDZBD1HZhLsTQIer3_ZlIFm7mlUMX6nmPYbvAPuoEMq97serIgHkVzRMa4/exec"
SYNC_ENABLED = "false"
SYNC_DRY_RUN = "true"
SYNC_BATCH_SIZE = "5"
SYNC_TIMEOUT_MS = "10000"
SYNC_MAX_RETRIES = "2"
# Atur terpisah: npx wrangler secret put SYNC_TOKEN
