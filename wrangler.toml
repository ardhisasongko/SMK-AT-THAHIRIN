# Cloudflare Pages + D1 configuration for SMK PLUS AT-THAHIRIN
# Docs: https://developers.cloudflare.com/pages/functions/

name = "smk-at-tahirin"
compatibility_date = "2026-08-04"
pages_build_output_dir = "dist"

# D1 Database binding
[[d1_databases]]
binding = "DB"                                # nama binding (dipakai di fungsi sebagai env.DB)
database_name = "smk-at-tahirin-db"          # nama database di dashboard Cloudflare
database_id = "e436d309-e92a-430d-8c48-c47752b3391b"          # ganti dengan database_id asli (lihat instruksi deploy)
migrations_dir = "migrations"

# Shared variable untuk konfigurasi akses
[vars]
APP_NAME = "SMK PLUS AT-THAHIRIN"
# Identitas sekolah untuk output user-facing (pesan WhatsApp, CSV rapor, prompt AI).
SCHOOL_NAME = "SMK PLUS AT-THAHIRIN"
SCHOOL_EMAIL_DOMAIN = "smksplusatthahirin.sch.id"
# Flag harus eksplisit. Nilai true mempertahankan fitur AI yang sudah tersedia;
# nonaktifkan dari dashboard bila diperlukan tanpa deploy ulang.
GEMINI_ENABLED = "true"
GEMINI_MODEL = "gemini-3.6-flash"
# Cloudflare Turnstile di login (hardening Fase C) — site key bersifat publik.
# Kosong (bawaan) = fitur MATI dan login seperti biasa. Isi site key dari
# dashboard Cloudflare (Turnstile) untuk mengaktifkan; secret pasangannya
# WAJIB dipasang sebagai Secret TURNSTILE_SECRET_KEY (lihat bawah). Fitur
# hanya aktif bila KEDUANYA terisi.
TURNSTILE_SITE_KEY = ""

# GEMINI_API_KEY sebaiknya di-set sebagai SECRET (bukan vars) di Cloudflare Pages:
#   Dashboard Pages -> Settings -> Variables and Secrets -> Secrets -> GEMINI_API_KEY
# atau via CLI:  npx wrangler pages secret put GEMINI_API_KEY --project-name smk-at-tahirin
#
# TOTP_ENCRYPTION_KEY (hardening Fase B — kunci enkripsi secret 2FA staf)
# juga WAJIB secret, JANGAN ditulis di [vars]:
#   npx wrangler pages secret put TOTP_ENCRYPTION_KEY --project-name smk-at-tahirin
# Kunci harus stabil antar deploy; menggantinya mengharuskan staf mengatur
# ulang 2FA (dibantu penonaktifan oleh administrator).
#
# TURNSTILE_SECRET_KEY (hardening Fase C — verifikasi Turnstile login)
# juga WAJIB secret; pasangannya TURNSTILE_SITE_KEY ada di [vars] atas:
#   npx wrangler pages secret put TURNSTILE_SECRET_KEY --project-name smk-at-tahirin
